[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driveguard"
version = "0.1.0"
description = "Operator console for CAS and DMS alerts scored over a driving session"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "H3Xobit" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "paho-mqtt>=2.1.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "sse-starlette>=2.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
torch = [
  "torch>=2.4.0",
]
llm = [
  "anthropic>=0.39.0",
  "openai>=1.50.0",
]

[project.scripts]
dg-simulate = "driveguard.simulator.session:main"
dg-ingest = "driveguard.ingestion.consumer:main"
dg-eval = "driveguard.eval_harness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driveguard"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/driveguard/assets" = "driveguard/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
